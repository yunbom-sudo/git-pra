<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 첫 번째 웹사이트</title>
    <style>
        /* 기본 스타일 초기화 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f4f4f9;
        }

        /* 헤더 & 네비게이션 */
        header {
            background-color: #4A90E2;
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav ul {
            display: flex;
            list-style: none;
        }

        nav ul li {
            margin-left: 20px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        nav ul li a:hover {
            text-decoration: underline;
        }

        /* 메인 히어로 섹션 */
        .hero {
            background: #ffffff;
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #222;
        }

        .hero p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background: #4A90E2;
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
        }

        .btn:hover {
            background: #357ABD;
        }

        /* 콘텐츠 섹션 (카드 레이아웃) */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .services {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: white;
            padding: 1.5rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-bottom: 0.5rem;
            color: #4A90E2;
        }

        /* 푸터 */
        footer {
            text-align: center;
            padding: 1.5rem;
            background: #333;
            color: white;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <!-- 헤더 영역 -->
    <header>
        <h1>이 사이트는 김윤범이 반환했다.</h1>
        <nav>
            <ul>
                <li><a href="#home">홈</a></li>
                <li><a href="#about">소개</a></li>
                <li><a href="#services">서비스</a></li>
                <li><a href="#contact">문의하기</a></li>
            </ul>
        </nav>
    </header>

    <!-- 메인 비주얼 영역 -->
    <section class="hero" id="home">
        <h2>환영합니다!</h2>
        <p>HTML과 CSS로 만든 깔끔하고 반응형인 웹사이트 예시입니다.</p>
        <a href="#services" class="btn">자세히 보기</a>
    </section>

    <!-- 콘텐츠 카드 영역 -->
    <main class="container" id="services">
        <div class="services">
            <div class="card">
                <h3>웹 디자인</h3>
                <p>사용자 친화적이고 현대적인 감각의 웹 인터페이스를 설계합니다.</p>
            </div>
            <div class="card">
                <h3>웹 개발</h3>
                <p>최신 기술을 활용하여 빠르고 안정적인 웹 애플리케이션을 개발합니다.</p>
            </div>
            <div class="card">
                <h3>유지 보수</h3>
                <p>지속적인 업데이트와 보안 관리를 통해 웹사이트를 최적의 상태로 유지합니다.</p>
            </div>
        </div>

        <h1>안녕</h1>
    </main>

    <!-- 푸터 영역 -->
    <footer>
        <p>&copy; 2026 MyWebsite. All rights reserved.</p>
    </footer>

</body>
</html>
